services:
  shadowshare:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - openvpn_data:/etc/openvpn:ro
      - cloak_data:/etc/cloak:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "3101"
      - "3896"
    restart: unless-stopped

  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    cap_add:
      - NET_ADMIN
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - ./data/shadowtls-config.json:/etc/sing-box/config.json
      - caddy_data:/etc/sing-box/certs:ro
    ports:
      # UDP protocols keep their own ports (can't SNI-route UDP the same way)
      - "8445:8445/udp"
      - "8446:8446/udp"
    expose:
      # TCP protocols (ShadowTLS, Trojan) routed via Caddy L4 SNI multiplexer on port 443
      - "8444"
      - "8447"
      - "9090"
      # SOCKS5 inbound for DNS tunnel fallback (accessed by dnstm container)
      - "10053"
      # No-auth SOCKS5 for MasterDnsVPN (accessed by dnstm container)
      - "10054"
    restart: unless-stopped

  marzban:
    image: gozargah/marzban:latest
    env_file: .env.marzban
    environment:
      - XRAY_JSON=/var/lib/marzban/xray_config.json
      - UVICORN_SSL_CERTFILE=/var/lib/marzban/cert.pem
      - UVICORN_SSL_KEYFILE=/var/lib/marzban/key.pem
    volumes:
      - ./marzban-data:/var/lib/marzban
    expose:
      # Reality (port 2053) and XHTTP-Reality (port 2054) routed via Caddy L4 SNI multiplexer on port 443
      - "2053"
      - "2054"
      - "8080"
      - "8081"
      - "8082"
      - "8083"
      - "8880"
    restart: unless-stopped

  caddy:
    build:
      context: ./docker
      dockerfile: Dockerfile.caddy
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN:-}
      # Read by Caddyfile {$VAR} placeholders (see Caddyfile.example)
      - ORIGIN_HOST=${ORIGIN_HOST:-}
      - CDN_SOURCE_DOMAIN=${CDN_SOURCE_DOMAIN:-}
      - CDN_CLEAN_DOMAIN=${CDN_CLEAN_DOMAIN:-}
      - CDN_BACKUP_DOMAIN=${CDN_BACKUP_DOMAIN:-}
      - DIRECT_TLS_DOMAIN=${DIRECT_TLS_DOMAIN:-}
      - NAIVE_PROXY_DOMAIN=${NAIVE_PROXY_DOMAIN:-}
      - REALITY_SNI=${REALITY_SNI:-}
      - XHTTP_REALITY_SNI=${XHTTP_REALITY_SNI:-}
      - SHADOWTLS_HANDSHAKE_SERVER=${SHADOWTLS_HANDSHAKE_SERVER:-}
      - MTPROTO_FAKETLS_DOMAIN=${MTPROTO_FAKETLS_DOMAIN:-cloudflare.com}
      - CDN_WS_PATH=${CDN_WS_PATH:-/ws}
      - CDN_HU_PATH=${CDN_HU_PATH:-/hu}
      - CDN_GRPC_PATH=${CDN_GRPC_PATH:-/grpc}
      - CDN_XHTTP_PATH=${CDN_XHTTP_PATH:-/xh}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "2083:2083"
      - "37423:37423/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - ./data/naive-users:/etc/caddy/naive-users:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - shadowshare
      - marzban
      - singbox
      - mtg
    restart: unless-stopped

  amneziawg:
    build:
      context: ./docker
      dockerfile: Dockerfile.amneziawg
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "51820:51820/udp"
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data/amneziawg:/etc/amneziawg
    restart: unless-stopped

  openvpn:
    build:
      context: ./docker
      dockerfile: Dockerfile.openvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - openvpn_data:/etc/openvpn
    restart: unless-stopped

  cloak:
    build: ./docker/cloak
    ports:
      - "4443:443"
    environment:
      - CLOAK_UPSTREAM=openvpn:1194
      - CLOAK_REDIR_ADDR=www.bing.com
    volumes:
      - cloak_data:/etc/cloak
    depends_on:
      - openvpn
    restart: unless-stopped

  mieru:
    build:
      context: ./docker
      dockerfile: Dockerfile.mieru
    volumes:
      - ./data/mieru-server.json:/etc/mita/server.json:ro
    ports:
      - "17261-17264:17261-17264/tcp"
      - "29987-29990:29987-29990/udp"
    restart: unless-stopped

  mtg:
    image: nineseconds/mtg:2
    command: ["run", "/config.toml"]
    volumes:
      - ./data/mtg.toml:/config.toml:ro
    expose:
      - "3128"
    restart: unless-stopped

  dnstm:
    build:
      context: ./docker
      dockerfile: Dockerfile.dnstm
    ports:
      - "${PUBLIC_SERVER_IP:-${AWG_SERVER_IP:?set PUBLIC_SERVER_IP in .env}}:53:53/udp"
      # TCP 53 removed — dns-router.py is UDP-only, TCP was flagged by BSI as open resolver
      - "${PUBLIC_SERVER_IP:-${AWG_SERVER_IP:?set PUBLIC_SERVER_IP in .env}}:2222:2222/tcp"
    volumes:
      - dnstm_data:/etc/dnstm
      - ./data/dnstt-keys:/etc/dnstm/keys:ro
      - ./data/ssh-tunnel/authorized_keys:/home/tunnel/.ssh/authorized_keys:ro
    environment:
      - TUNNEL_DOMAIN=${DNSTT_TUNNEL_DOMAIN:-}
      - DNSTT_MTU=${DNSTT_MTU:-1232}
      - DNSTT_SSH_PASSWORD=${DNSTT_SSH_PASSWORD:-}
      - DNSTT_XRAY_UUID=${DNSTT_XRAY_UUID:-}
      - MASTERDNS_ENCRYPTION_KEY=${MASTERDNS_ENCRYPTION_KEY:-}
      - MASTERDNS_SUBDOMAIN=${MASTERDNS_SUBDOMAIN:-m}
    depends_on:
      - singbox
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  openvpn_data:
  cloak_data:
  dnstm_data:
