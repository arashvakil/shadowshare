name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Migrations apply cleanly to a fresh database
        env:
          DATABASE_PATH: ${{ runner.temp }}/ci.db
          TELEGRAM_ID_SALT: ci-only
        run: npx tsx src/db/migrate.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          if [ -d ops ]; then
            # Private ops overlay: its history and ops/ hold deployment secrets by design.
            # Scan only what `git archive` would publish (export-ignore applied).
            mkdir -p "$RUNNER_TEMP/export"
            git archive HEAD | tar -x -C "$RUNNER_TEMP/export"
            docker run --rm -v "$RUNNER_TEMP/export:/repo" zricethezav/gitleaks:v8.30.1 \
              detect --no-git --source /repo --redact --verbose
          else
            docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
              detect --source /repo --redact --verbose
          fi
