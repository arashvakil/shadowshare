name: Bug report
description: Something in ShadowShare doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post:** remove your server IP, domains, paths, keys, tokens, invite codes and Telegram links from everything below, including logs and screenshots. This issue is public.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: ShadowShare version or commit
      placeholder: v1.0.0 or a commit hash
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: "`docker compose logs --tail 100 shadowshare` or the relevant service."
      render: text
